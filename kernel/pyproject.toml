[project]
name = "heycarl"
version = "0.1.0"
description = "Kernel of Hey Carl, a personal application framework"
requires-python = ">=3.13"
dependencies = [
  "aiohttp",
  "anyio",
  "cryptography",
  "fastapi",
  "httpx",
  "psycopg",
  "py-vapid",
  "pydantic",
  "pyjwt",
  "pywebpush",
  "structlog",
  "uvicorn",
]

[project.scripts]
heycarl = "heycarl.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["heycarl"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"asyncio".msg = "Use anyio."
